[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-engine"
version = "0.1.0"
description = "Evidence-first research infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Research Engine contributors" }]
keywords = ["research", "evidence", "agents", "connectors", "synthesis", "crawler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
report = ["reportlab>=4.0"]
browser = ["playwright>=1.49"]
all = ["reportlab>=4.0", "playwright>=1.49"]
dev = ["pypdf>=5.0", "pytest>=8.0", "ruff>=0.8"]

[project.scripts]
research = "research_engine.cli:research_main"
research-engine = "research_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_engine = ["default_packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
